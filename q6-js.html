<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id = "removeAll">Remove All</button>
    <ul>
      <li>
        <p>Task - 1</p>
        <button class="delete_button">delete</button>
      </li>
      <li>
        <p>Task - 2</p>
        <button class="delete_button">delete</button>
      </li>
      <li>
        <p>Task - 3</p>
        <button class="delete_button">delete</button>
      </li>
      <li>
        <p>Task - 4</p>
        <button class="delete_button">delete</button>
      </li>

      <script>
        // remove all button - Removes all the list items
        // Individual remove button - removes that task only

        const removeAllBtn = document.getElementById('removeAll')
        const allBtns = document.querySelectorAll('.delete_button')

        removeAllBtn.addEventListener('click', function() {
            //Remove all the tasks
            document.querySelector('ul').remove()
            
            //disable removeAllBtn
            removeAllBtn.disabled = true
        })

        for(let i = 0; i < allBtns.length; i++) {
            allBtns[i].addEventListener('click', function(e) {
                e.target.parentElement.remove()
            })
        }
      </script>
</body>
</html>
