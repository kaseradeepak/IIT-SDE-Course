<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
          box-sizing: border-box;
        }
  
        body {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-around;
          padding-top: 5rem;
        }
  
        .blue {
          background-color: blue;
          box-shadow: 0px 0px 6px 5px;
        }
  
        .green {
          background-color: green;
          box-shadow: 0px 0px 6px 5px;
        }
  
        .red {
          background-color: red;
          box-shadow: 0px 0px 6px 5px;
        }
  
        .card {
          border: 1px solid;
          height: 10rem;
          width: 10rem;
          margin: 2rem;
        }
      </style>
</head>
<body>
    <div class="card" data-color="blue"></div>
    <div class="card" data-color="red"></div>
    <div class="card" data-color="blue"></div>
    <div class="card" data-color="red"></div>
    <div class="card" data-color="red"></div>
    <div class="card" data-color="blue"></div>
    <div class="card" data-color="green"></div>
    <div class="card" data-color="blue"></div>
    <div class="card" data-color="green"></div>
    <div class="card" data-color="blue"></div>

    <script>
        //Task - Write JS code to apply the CSS property (as per the data-color attribute) to each card on dblclick event

        //Add event listener to all the div
        const allDivs = document.querySelectorAll(".card")

        console.log(allDivs)

        for(let i = 0; i < allDivs.length; i++) {
          allDivs[i].addEventListener('dblclick', function(e) {
            // console.log(e)
            const color = e.target.getAttribute('data-color')

            e.target.classList.add(color)
          })
        }
    </script>
</body>
</html>
