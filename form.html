<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Survey Form</h1>

    <form>
        <label>Name: </label>
        <input type="text">

        <label>Email: </label>
        <input type="text" placeholder="abc@gmail.com">

        <label>Address: </label>
        <input type="text">

        <label>Phone Number: </label>
        <!-- <input type="number" maxlength="10" pattern="\d{10}"> -->
        <input type="number" inputmode="numeric" pattern="[0-9]*" maxlength="10">

        <label>DOB</label>
        <input type="date" min="01-01-2000" max="01-01-2050">

        <h1>Operating System you use: </h1>
        <select>
            <option>MacOS</option>
            <option>Windows</option>
            <option>Linux</option>
        </select>

        <h1>Degree</h1>
        <label>BTech</label>
        <input type="checkbox">

        <label>BSC</label>
        <input type="checkbox">

        <label>MS</label>
        <input type="checkbox">

        <button>Submit</button>
    </form>
</body>
</html>
